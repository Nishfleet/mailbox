name: grade
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  grade:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: Nishfleet/fleet-ops/.github/workflows/grade.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
