name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Lint the workflows (actionlint)
        # Same pinned image as Nishfleet/0509 ci.yml (fleet-wide rule, Nish 2026-09-28).
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Audit the workflows (zizmor)
        # Offline, tokenless; policy in .github/zizmor.yml. Same pin as Nishfleet/0509.
        uses: docker://ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
        with:
          args: --offline --format plain .github/workflows
      - run: npm test

  # Secret scan: gitleaks from the shared fleet CI standard. GitHub's own secret
  # scanning is a paid feature on private repos (Nish 2026-09-25: "setup secret scan").
  secret-scan:
    uses: Nishfleet/fleet-ops/.github/workflows/reusable-pr-checks.yml@baaf20529452b3f06a3cf8687ab894f5343aefaa # main 2026-09-25
    permissions:
      contents: read
      pull-requests: read
    with:
      node-version: ""
      install-command: ""
      verify-command: ""
      timeout-minutes: 5
