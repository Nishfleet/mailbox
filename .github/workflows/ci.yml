name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Lean-code suppressions only shrink
        # eslint-suppressions.json holds the violations main had when the
        # limits landed (81). A PR may lower this ceiling, never raise it.
        run: test "$(jq '[.[][] | .count] | add' eslint-suppressions.json)" -le 81
      - run: npm test

  # Secret scan: gitleaks from the shared fleet CI standard. GitHub's own secret
  # scanning is a paid feature on private repos (Nish 2026-09-25: "setup secret scan").
  secret-scan:
    uses: Nishfleet/fleet-ops/.github/workflows/reusable-pr-checks.yml@baaf20529452b3f06a3cf8687ab894f5343aefaa # main 2026-09-25
    permissions:
      contents: read
      pull-requests: read
    with:
      node-version: ""
      install-command: ""
      verify-command: ""
      timeout-minutes: 5
