# Weekly dependency watch. One grouped PR per ecosystem, at most two open at a
# time. Upstream releases are taken 3 days after publish, per the owner's
# 2026-10-22 standing rule; the window is update latency, not a
# malicious-publish quarantine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Patch and minor updates inside a ^ range touch only the lockfile, which
    # CODEOWNERS leaves unowned, so they auto-merge. A major, or any bump to an
    # exact pin, edits package.json and waits for the owner.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      cloudflare-agents:
        patterns:
          - "agents"
          - "@cloudflare/ai-chat"
          - "ai"
          - "@ai-sdk/*"
          - "workers-ai-provider"
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
